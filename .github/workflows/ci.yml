# GitHub Actions: runs automatically on GitHub every time you push to main or v2.
# See results in your repo's "Actions" tab. A red X means something broke:
#   backend   -> lint + all backend tests
#   training  -> data prep + baseline on synthetic data
#   frontend  -> lint + production build
#   docker    -> builds both Docker images (only if the above pass)
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - run: ruff check app tests
      - run: pytest -q

  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only parts: data prep + baseline on synthetic data
      - run: pip install pandas pyarrow numpy "scikit-learn>=1.6" joblib pytest
      - run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
