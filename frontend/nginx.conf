# nginx = the web server inside the frontend container. It does two jobs:
#   1. Serves the website files (HTML, JS, CSS).
#   2. Forwards every request starting with /api/ to the backend container.
# So the browser only ever talks to ONE address (http://localhost:8080) and
# never needs to know where the backend lives.

server {
  listen 8080;  # port inside the container (docker-compose maps your Mac's 8080 to this)
  server_name _;
  root /usr/share/nginx/html;  # where the built website files are
  client_max_body_size 10m;  # allow screenshot uploads up to 10 MB

  # Built files have a content hash in their name (index-BbF30Y4_.js), so a new
  # build always gets new names. That means browsers can cache them forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API calls: pass them to the backend. "backend" is the service name in
  # docker-compose.yml; Docker's internal network turns that name into an address.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # the visitor's real IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Streaming results (Server-Sent Events) must NOT be buffered, or the page
    # would only update when the whole check is finished.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;  # checks can take over a minute
  }

  # This is a single-page app: React handles /history, /insights, /a/<id> in the
  # browser. Any path that isn't a real file gets index.html, and React takes over.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";  # always fetch the newest index.html
  }

  # Small security headers.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
